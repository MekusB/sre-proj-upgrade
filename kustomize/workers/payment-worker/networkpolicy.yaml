apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-worker
  namespace: workers
spec:
  podSelector:
    matchLabels:
      app: payment-worker
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules — nothing calls this pod, it only consumes Service Bus.
  egress:
    # Azure Service Bus — public endpoint, no stable IP to scope to.
    - ports:
        - port: 443
          protocol: TCP
        - port: 5671
          protocol: TCP
