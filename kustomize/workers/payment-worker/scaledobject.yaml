apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-worker-scaledobject
  namespace: workers
spec:
  scaleTargetRef:
    name: payment-worker
  pollingInterval: 10
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 15
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: sre-sb-namespace
        topicName: checkout-events
        subscriptionName: payment
        messageCount: "1"
      authenticationRef:
        name: payment-worker-trigger-auth
