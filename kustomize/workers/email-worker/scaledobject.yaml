apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: email-worker-scaledobject
  namespace: workers
spec:
  scaleTargetRef:
    name: email-worker
  pollingInterval: 10
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 8
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: sre-sb-namespace
        topicName: checkout-events
        subscriptionName: email
        messageCount: "1"
      authenticationRef:
        name: email-worker-trigger-auth
