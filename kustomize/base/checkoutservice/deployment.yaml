apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
  namespace: core
  labels:
    app: checkoutservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      labels:
        app: checkoutservice
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: checkoutservice-sa
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          image: jukpozi/checkoutservice:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 5050
          env:
            - name: PORT
              value: "5050"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice.core.svc.cluster.local:3550"
            - name: CART_SERVICE_ADDR
              value: "cartservice.core.svc.cluster.local:7070"
            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice.core.svc.cluster.local:7000"
            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice.core.svc.cluster.local:50051"
            - name: EMAIL_SERVICE_ADDR
              value: "emailservice.core.svc.cluster.local:5000"
            - name: PAYMENT_SERVICE_ADDR
              value: "paymentservice.core.svc.cluster.local:50051"
            - name: ENABLE_EVENT_PUBLISHING
              value: "1"
            - name: SERVICEBUS_NAMESPACE
              value: "sre-sb-namespace"
            - name: SERVICEBUS_TOPIC
              value: "checkout-events"
            - name: ENABLE_TRACING
              value: "1"
            - name: ENABLE_PROFILER
              value: "0"
            - name: COLLECTOR_SERVICE_ADDR
              value: "otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "checkoutservice"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 5050
          livenessProbe:
            grpc:
              port: 5050
