apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: redis-secret-provider
  namespace: core
spec:
  provider: azure
  parameters:
    # Per-pod workload identity (cartservice-sa), not the AKS addon's own
    # identity — see terraform/modules/workload-identity's
    # cartservice_keyvault_secrets_user role assignment.
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "546eacdf-f31f-4950-9319-73a6ce56713c"
    keyvaultName: "sre-core-kv"
    # Paste the value of `terraform output -raw azure_tenant_id` here.
    tenantId: "<AZURE_TENANT_ID>"
    objects: |
      array:
        - |
          objectName: redis-connection-string
          objectType: secret
  secretObjects:
    - secretName: redis-secret
      type: Opaque
      data:
        - objectName: redis-connection-string
          key: connectionString
