apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: redis-secret-provider
  namespace: core
spec:
  provider: azure
  parameters:
    # Per-pod workload identity (cartservice-sa), not the AKS addon's own
    # identity — see terraform/modules/workload-identity's
    # cartservice_keyvault_secrets_user role assignment.
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "a0b14ac1-7db5-4199-97f2-4c887e30c800"
    keyvaultName: "sre-core-pj-kv"
    # Paste the value of `terraform output -raw azure_tenant_id` here.
    tenantId: "104704fd-f711-4575-99d5-8a6588951c90"
    objects: |
      array:
        - |
          objectName: redis-connection-string
          objectType: secret
  secretObjects:
    - secretName: redis-secret
      type: Opaque
      data:
        - objectName: redis-connection-string
          key: connectionString
