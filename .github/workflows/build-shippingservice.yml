name: Build ShippingService Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "services/shippingservice/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        working-directory: services/shippingservice
        run: go mod tidy

      - name: Run tests
        working-directory: services/shippingservice
        run: go test ./...

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

#       - name: Initialize CodeQL
#         uses: github/codeql-action/init@v3
#         with:
#           languages: go
# 
#       - name: Build for CodeQL
#         working-directory: services/shippingservice
#         run: go build -a ./...
# 
#       - name: Perform CodeQL Analysis
#         uses: github/codeql-action/analyze@v3

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/shippingservice:${{ github.sha }} \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/shippingservice:latest \
          ./services/shippingservice

#       - name: Scan image for vulnerabilities
#         uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
#         with:
#           image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/shippingservice:${{ github.sha }}
#           format: table
#           exit-code: '1'
#           severity: CRITICAL

      - name: Push image to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/shippingservice --all-tags

      - name: Bump image tag in kustomize overlays
        run: |
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" kustomize/overlays/dev/shippingservice/kustomization.yaml
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" kustomize/overlays/dev/shipping-worker/kustomization.yaml

      - name: Commit and push tag bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomize/overlays/dev/shippingservice/kustomization.yaml kustomize/overlays/dev/shipping-worker/kustomization.yaml
          git commit -m "chore(shippingservice): bump image to ${{ github.sha }}" || echo "no changes to commit"
          git pull --rebase origin main
          git push
