name: Build PaymentService Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "services/paymentservice/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: services/paymentservice
        run: npm ci

      - name: Run tests
        working-directory: services/paymentservice
        run: npm test
        continue-on-error: true

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

#       - name: Initialize CodeQL
#         uses: github/codeql-action/init@v3
#         with:
#           languages: javascript-typescript
#           build-mode: none
# 
#       - name: Perform CodeQL Analysis
#         uses: github/codeql-action/analyze@v3

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/paymentservice:${{ github.sha }} \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/paymentservice:latest \
          ./services/paymentservice

#       - name: Scan image for vulnerabilities
#         uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
#         with:
#           image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/paymentservice:${{ github.sha }}
#           format: table
#           exit-code: '1'
#           severity: CRITICAL

      - name: Push image to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/paymentservice --all-tags

      - name: Bump image tag in kustomize overlays
        run: |
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" kustomize/overlays/dev/paymentservice/kustomization.yaml
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" kustomize/overlays/dev/payment-worker/kustomization.yaml

      - name: Commit and push tag bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomize/overlays/dev/paymentservice/kustomization.yaml kustomize/overlays/dev/payment-worker/kustomization.yaml
          git commit -m "chore(paymentservice): bump image to ${{ github.sha }}" || echo "no changes to commit"
          git pull --rebase origin main
          git push
