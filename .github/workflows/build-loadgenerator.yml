name: Build LoadGenerator Image

on:
  push:
    branches: [ main ]
    paths:
      - "services/loadgenerator/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check locustfile
        working-directory: services/loadgenerator
        run: python -m py_compile locustfile.py

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/loadgenerator:${{ github.sha }} \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/loadgenerator:latest \
          ./services/loadgenerator

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/loadgenerator:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Push image to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/loadgenerator --all-tags

      - name: Bump image tag in kustomize overlay
        run: |
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" kustomize/overlays/dev/loadgenerator/kustomization.yaml

      - name: Commit and push tag bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomize/overlays/dev/loadgenerator/kustomization.yaml
          git commit -m "chore(loadgenerator): bump image to ${{ github.sha }}" || echo "no changes to commit"
          git pull --rebase origin main
          git push
