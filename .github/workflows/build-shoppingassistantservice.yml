name: Build ShoppingAssistantService Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "services/shoppingassistantservice/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: services/shoppingassistantservice
        run: pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: services/shoppingassistantservice
        run: python -m pytest
        continue-on-error: true

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

#       - name: Initialize CodeQL
#         uses: github/codeql-action/init@v3
#         with:
#           languages: python
#           build-mode: none
# 
#       - name: Perform CodeQL Analysis
#         uses: github/codeql-action/analyze@v3

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/shoppingassistantservice:latest \
          ./services/shoppingassistantservice

#       - name: Scan image for vulnerabilities
#         uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
#         with:
#           image-ref: ${{ secrets.DOCKER_USERNAME }}/shoppingassistantservice:latest
#           format: table
#           exit-code: '1'
#           ignore-unfixed: true
#           severity: CRITICAL

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/shoppingassistantservice:latest
