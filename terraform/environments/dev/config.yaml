environment: dev

location: westus2

rg_name: sre-core-rg

network:
  vnet_cidr: "10.0.0.0/16"
  subnet_cidr: "10.0.0.0/22"

aks:
  cluster_name: "sre-aks"
  vm_size: "Standard_D2s_v5"      # B4als_v2 + D2s_v3 + B4ms + B4as_v2 all CapacityRestricted in westus2
  node_min: 1
  node_max: 3
  user_vm_size: "Standard_D2s_v5"
  user_node_min: 1
  user_node_max: 3
  service_cidr: "10.1.0.0/16"
  dns_service_ip: "10.1.0.10"

cosmos:
  # Must be globally unique across Azure (lowercase letters, numbers, hyphens, 3-44 chars).
  name: "sre-pj-cosmos"
  throughput: 4000

servicebus:
  sku: "Standard"

redis:
  # Must be globally unique across Azure (forms <name>.redis.cache.windows.net).
  name: "sre-pj-redis-cart"
  # AKS outbound NAT IP — pods reach Redis via this public IP (Azure Cache for Redis
  # does not support VNet service endpoints, so the private subnet range won't work).
  # Update this value if the AKS cluster is rebuilt and gets a new egress IP.
  # Run (Git Bash on Windows needs MSYS_NO_PATHCONV=1, otherwise the resource
  # ID's leading "/" gets mangled into a Windows path):
  #   ID=$(az aks show --name sre-aks --resource-group sre-core-rg --query "networkProfile.loadBalancerProfile.effectiveOutboundIPs[0].id" -o tsv)
  #   MSYS_NO_PATHCONV=1 az network public-ip show --ids "$ID" --query ipAddress -o tsv
  aks_outbound_ip: "20.3.53.152"

acr:
  # Must be globally unique across Azure (alphanumeric only, no hyphens, 5-50 chars).
  # Change this if it's already taken before the first `terraform apply`.
  name: "srepjcoreacr"
  sku: "Basic"

keyvault:
  # Must be globally unique across Azure (alphanumeric + hyphens, 3-24 chars).
  # If you change this, also update kustomize/base/cartservice/secretproviderclass.yaml.
  name: "sre-core-pj-kv"

# <org>/<repo> — scopes the GitHub Actions OIDC federated credential subject so
# only workflow runs from this exact repo (on github_ref, default main) can
# assume the CI identity and push to ACR.
#
# NOTE: not just "<org>/<repo>" — GitHub's OIDC subject claim now embeds the
# numeric owner ID and repo ID (e.g. "MekusB@100003404/sre-proj-upgrade@1341928717")
# to stop a subject claim being reused if a username or repo gets renamed/
# reassigned later. A federated credential built from the plain slug alone
# gets AADSTS700213 "No matching federated identity record found" even
# though the repo name is exactly right. Get the real value from a failed
# azure/login run's own log ("subject claim - repo:...") and paste it here
# verbatim, or from `gh api repos/<org>/<repo> --jq '.owner.id, .id'`.
github_repo: "MekusB@100003404/sre-proj-upgrade@1341928717"

# Absolute path to python.exe on the machine running `terraform apply`, used
# by the Cosmos-seeding local-exec provisioner. Not "python"/"py" — on
# Windows those resolve to a Microsoft Store app-execution-alias stub instead
# of a real interpreter unless every terminal/IDE process is fully relaunched
# after install (a new tab isn't enough; PATH is only re-read at process
# start). Find yours with: (Get-Command python).Source in a brand-new
# PowerShell window opened after installing Python.
python_executable: "C:/Users/ADMIN/AppData/Local/Programs/Python/Python312/python.exe"
